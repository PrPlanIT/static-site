server {
    listen ${LISTEN_PORT};
    listen [::]:${LISTEN_PORT};
    server_name _;

    # We sit behind a gateway that terminates TLS — keep redirects relative so the
    # public scheme/host/port are preserved.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers on every response
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Liveness/readiness endpoint for k8s probes (cheap, unlogged)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Long-cache immutable static assets
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Plain static content: serve the file/dir, else 404 (the gateway renders error pages)
    location / {
        try_files $uri $uri/ =404;
    }
}
